[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faultaware"
version = "1.0.0"
description = "BT-185: Fault-Aware ML/DL-based algorithm for cloud architecture (failure prediction + FARS scheduler)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Aryan Raj" },
  { name = "Dheeraj Kumar" },
  { name = "Navneet Kumar" },
  { name = "Priyansh Kumar" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "imbalanced-learn>=0.12",
  "torch>=2.4",
  "shap>=0.46",
  "simpy>=4.1",
  "pandera>=0.20",
  "omegaconf>=2.3",
  "optuna>=4.0",
  "matplotlib>=3.9",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "joblib>=1.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-PyYAML",
  "pre-commit>=3.8",
  "nbstripout>=0.7",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["faultaware*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/archive", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "RUF001", "RUF002", "RUF003"]  # X/X_train are standard ML names

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"notebooks/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
disallow_any_generics = false
warn_return_any = false
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running tests (run nightly / manually)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src/faultaware"]
omit = ["src/faultaware/eval/plots.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
