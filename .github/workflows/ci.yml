name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # nightly: include slow tests

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e ".[dev]" --no-deps
      - name: Lint
        run: |
          ruff check src scripts app tests
          ruff format --check src scripts app tests
      - name: Type-check
        run: mypy src app
      - name: Tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pytest --cov --cov-fail-under=80
          else
            pytest -m "not slow" --cov --cov-fail-under=80
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    # Multi-arch build check (amd64 for laptops/x86 VMs, arm64 for Oracle Ampere A1).
    # main only (CLAUDE.md §11) or manual: the arm64 half runs under QEMU and is slow.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 + linux/arm64 (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: bt185-faultaware:ci
